version: '3.8'

services:
  db:
    image: postgres:15
    container_name: thermal_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: thermal_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    restart: unless-stopped

  etl-worker:
    build: .
    container_name: python_etl_worker
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://admin:password123@db:5432/thermal_db
    volumes:
      - ./src:/app/src

volumes:
  pgdata: